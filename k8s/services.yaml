apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
spec:
  selector: { app: student-service }
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector: { app: gateway-registration }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
