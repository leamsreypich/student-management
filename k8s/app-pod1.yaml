apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway-registration }
  template:
    metadata:
      labels: { app: gateway-registration }
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - { name: REGISTRATION_URL, value: "http://localhost:3001" }
            - { name: STUDENT_URL, value: "http://student-service:3002" }
        - name: registration
          image: registration:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - { name: DB_HOST, value: "mysql" }
