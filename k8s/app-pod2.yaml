apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: student-service }
  template:
    metadata:
      labels: { app: student-service }
    spec:
      containers:
        - name: student-service
          image: student-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - { name: DB_HOST, value: "mysql" }
